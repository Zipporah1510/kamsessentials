<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamsessentials</title>
<style>
body{margin:0;font-family:Arial;background:#fff8f0;text-align:center}
header{background:#000;color:gold;padding:30px 15px}
h1{letter-spacing:2px;margin:0}
.products{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:220px;object-fit:cover;border-radius:10px;background:#eee}
.btn{display:inline-block;background:#000;color:gold;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:8px}
footer{background:#000;color:#fff;padding:20px;margin-top:20px}
</style></head><body>
<header><h1>KAMSESSENTIALS</h1><p>Luxury Scents & Body Essentials • Lagos Delivery</p></header>
<h2>Our Collection</h2>
<div id="products" class="products">Loading your 7 products...</div>
<footer><p>Order on WhatsApp: +234... | Instagram: @kamsessentials</p></footer>
<script>
fetch('https://api.github.com/repos/Zipporah1510/kamsessentials/contents')
.then(r=>r.json()).then(files=>{
  const imgs = files.filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name) && f.name.toLowerCase()!=='logo.png');
  document.getElementById('products').innerHTML = imgs.map(f=>`
    <div class="card">
      <img src="${f.name}">
      <h3>${f.name.split('.')[0].replace(/-|_/g,' ')}</h3>
      <p>₦ Ask Price</p>
      <a class="btn" href="https://wa.me/2340000000000?text=Hi%20I%20want%20to%20order%20${f.name}">Order on WhatsApp</a>
    </div>
  `).join('');
});
</script>
</body></html>
