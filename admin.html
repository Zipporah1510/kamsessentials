<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMS Admin</title>
<style>
*{box-sizing:border-box}body{font-family:'Poppins',sans-serif;background:#020617;color:#fff;max-width:500px;margin:0 auto;padding:0}
#lock{position:fixed;inset:0;background:#020617;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:#0F172A;border:1px solid #1E3A8A;border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center}
.lock-box input{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#020617;color:#fff;margin:12px 0;text-align:center;font-size:16px;letter-spacing:2px}
.lock-btn{width:100%;padding:12px;background:#60A5FA;color:#000;border:none;border-radius:25px;font-weight:800;cursor:pointer}
#content{display:none;padding:14px}
.box{background:#0F172A;border:1px solid #1E3A8A;border-radius:16px;padding:14px;margin-bottom:14px}
input.field{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;margin:6px 0}
.btn{width:100%;padding:12px;background:#60A5FA;color:#000;border:none;border-radius:25px;font-weight:800;margin-top:8px;cursor:pointer}
.item{display:flex;gap:10px;background:#0F172A;padding:8px;border-radius:10px;margin-bottom:8px;align-items:center;border:1px solid #1E293B}
.item img{width:60px;height:60px;border-radius:8px;object-fit:cover}
</style></head><body>
<div id="lock">
<div class="lock-box">
<div style="font-size:40px">🔒</div>
<h3 style="margin:10px 0;color:#93C5FD">KAMS Private Admin</h3>
<input id="pass" type="password" placeholder="Enter password">
<button class="lock-btn" onclick="checkPass()">Unlock 🔓</button>
<p id="err" style="color:#ef4444;font-size:11px;margin-top:8px;display:none">Wrong password!</p>
<p style="font-size:9px;color:#475569;margin-top:12px">Default: 07010320816 • Backup: kams</p>
</div>
</div>
<div id="content">
<h3 style="text-align:center;margin:10px 0">💙 KAMS Admin</h3>
<div style="text-align:center;font-size:10px;color:#22c55e;margin-bottom:10px">✅ Unlocked</div>
<div class="box">
<input class="field" id="name" placeholder="Product name">
<input class="field" id="price" type="number" placeholder="Price">
<input class="field" id="cat" placeholder="Description">
<input class="field" id="file" type="file" accept="image/*">
<img id="prev" style="width:100%;height:200px;object-fit:cover;border-radius:12px;display:none;margin-top:8px">
<button class="btn" onclick="add()">+ ADD WITH PICTURE</button>
</div>
<!-- CHANGE PASSWORD BOX -->
<div class="box" style="border-style:dashed">
<div style="font-size:12px;font-weight:700;margin-bottom:8px">🔑 Change Password</div>
<input class="field" id="oldPass" type="password" placeholder="Current password">
<input class="field" id="newPass" type="password" placeholder="New password">
<button class="btn" style="background:#1E293B;color:#60A5FA;border:1px solid #334155" onclick="changePassword()">Save New Password</button>
<p style="font-size:9px;color:#64748B;margin-top:6px">Current: <span id="showPass" style="color:#60A5FA">07010320816</span> • Backup always: kams</p>
</div>
<h4 style="margin:12px 0;font-size:13px">Products (<span id="count">0</span>)</h4>
<div id="list"></div>
<div style="display:flex;gap:8px;margin-top:20px">
<a href="index.html" style="flex:1;text-align:center;background:#1E293B;color:#94A3B8;padding:10px;border-radius:20px;text-decoration:none;font-size:12px">← Main Site</a>
<button onclick="logout()" style="flex:1;background:transparent;border:1px solid #334155;color:#94A3B8;padding:10px;border-radius:20px;font-size:12px">Lock 🔒</button>
</div>
</div>
<script>
function getPassword(){return localStorage.getItem('kams_admin_pass')||"07010320816";}
function checkPass(){
let p=document.getElementById('pass').value;
if(p===getPassword()||p==="kams"||p==="KAMS"){
document.getElementById('lock').style.display='none';document.getElementById('content').style.display='block';localStorage.setItem('kams_admin_unlocked','yes');
}else{document.getElementById('err').style.display='block';document.getElementById('pass').value="";}
}
function logout(){localStorage.removeItem('kams_admin_unlocked');document.getElementById('lock').style.display='flex';document.getElementById('content').style.display='none';}
if(localStorage.getItem('kams_admin_unlocked')==='yes'){document.getElementById('lock').style.display='none';document.getElementById('content').style.display='block';}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')checkPass()});
function changePassword(){
let oldP=document.getElementById('oldPass').value,newP=document.getElementById('newPass').value.trim();
if(oldP!==getPassword()){alert("Old password no correct!");return;}
if(newP.length<3){alert("New password too short! Use at least 4 letters");return;}
localStorage.setItem('kams_admin_pass',newP);
document.getElementById('showPass').innerText=newP;
document.getElementById('oldPass').value="";document.getElementById('newPass').value="";
alert("✅ Password changed! New password na: "+newP+" — She go use am next time");
}
document.getElementById('showPass').innerText=getPassword();
let b64="";document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{b64=ev.target.result;let p=document.getElementById('prev');p.src=b64;p.style.display='block';};r.readAsDataURL(f);});
function get(){let s=localStorage.getItem('kams_real_v4');if(s){try{let a=JSON.parse(s);if(a.length>0)return a}catch(e){}}return [{n:"Vitamin C Lotion 400ml",p:10000,c:"Brighten",img:"images/vitamin-c.jpg"},{n:"Ceramide Cream 454ml",p:8000,c:"Barrier",img:"images/ceramide.jpg"},{n:"Corner Shelf",p:10000,c:"Storage",img:"images/corner-shelf.jpg"},{n:"Towel Rack",p:8000,c:"Bathroom",img:"images/towel-rack.jpg"},{n:"Carrot Soap",p:3500,c:"Brightening",img:"images/carrot-soap.jpg"},{n:"Lactic Serum",p:6000,c:"Glow",img:"images/serum.jpg"},{n:"Fruit Basket",p:9500,c:"Storage",img:"images/basket.jpg"}];}
function save(a){localStorage.setItem('kams_real_v4',JSON.stringify(a));show();}
function show(){let a=get();document.getElementById('count').innerText=a.length;document.getElementById('list').innerHTML=a.map((d,i)=>`<div class="item"><img src="${d.img}"><div style="flex:1"><div style="font-size:12px">${d.n}</div><div style="font-size:10px;color:#94A3B8">₦${d.p}</div></div><button onclick="del(${i})" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:15px;font-size:10px">Del</button></div>`).join('');}
function add(){let n=document.getElementById('name').value,p=parseInt(document.getElementById('price').value),c=document.getElementById('cat').value||"New";if(!n||!p)return alert("Fill name & price");if(!b64)return alert("Pick picture!");let a=get();a.push({n,p,c,img:b64});save(a);document.getElementById('name').value="";document.getElementById('price').value="";document.getElementById('cat').value="";document.getElementById('file').value="";document.getElementById('prev').style.display='none';b64="";alert("✅ Added!");}
function del(i){if(confirm("Delete?")){let a=get();a.splice(i,1);save(a);}}show();
</script>
</body></html>
